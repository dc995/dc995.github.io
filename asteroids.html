<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Piggy's Asteroid Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #000033 0%, #000000 100%);
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            border: 2px solid #ff69b4;
            background: #000011;
            display: block;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ff69b4;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            font-weight: bold;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 3px solid #ff69b4;
            border-radius: 10px;
            color: #ff69b4;
            text-align: center;
            display: none;
        }

        #gameOver h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
        }

        #gameOver button {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        #gameOver button:hover {
            background: #ff1493;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
        </div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
        <div id="instructions">
            ← → Rotate | ↑ Thrust | SPACE Fire | Help Miss Piggy destroy the orange faces!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = {
            playing: true,
            score: 0,
            lives: 3,
            level: 1
        };

        // Controls
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            Space: false
        };

        // Miss Piggy ship
        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.angle = -Math.PI / 2;
                this.velocity = { x: 0, y: 0 };
                this.radius = 20;
                this.rotationSpeed = 0.1;
                this.thrust = 0.15;
                this.friction = 0.98;
                this.invulnerable = 0;
            }

            update() {
                // Rotation
                if (keys.ArrowLeft) this.angle -= this.rotationSpeed;
                if (keys.ArrowRight) this.angle += this.rotationSpeed;

                // Thrust
                if (keys.ArrowUp) {
                    this.velocity.x += Math.cos(this.angle) * this.thrust;
                    this.velocity.y += Math.sin(this.angle) * this.thrust;
                }

                // Apply friction
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;

                // Update position
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Update invulnerability
                if (this.invulnerable > 0) this.invulnerable--;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Skip drawing if blinking during invulnerability
                if (this.invulnerable > 0 && Math.floor(this.invulnerable / 5) % 2 === 0) {
                    ctx.restore();
                    return;
                }

                // Draw Miss Piggy
                // Face
                ctx.fillStyle = '#ffb6c1';
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();

                // Snout
                ctx.fillStyle = '#ffc0cb';
                ctx.beginPath();
                ctx.ellipse(8, 0, 6, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Nostrils
                ctx.fillStyle = '#ff69b4';
                ctx.beginPath();
                ctx.arc(10, -2, 1.5, 0, Math.PI * 2);
                ctx.arc(10, 2, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(2, -5, 2, 0, Math.PI * 2);
                ctx.arc(2, 5, 2, 0, Math.PI * 2);
                ctx.fill();

                // Eyelashes
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(4, -6);
                ctx.lineTo(6, -7);
                ctx.moveTo(4, 6);
                ctx.lineTo(6, 7);
                ctx.stroke();

                // Blonde hair bow
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(-10, -10, 5, 0, Math.PI * 2);
                ctx.arc(-5, -12, 4, 0, Math.PI * 2);
                ctx.fill();

                // Ears
                ctx.fillStyle = '#ffb6c1';
                ctx.beginPath();
                ctx.ellipse(-8, -8, 4, 6, -0.5, 0, Math.PI * 2);
                ctx.ellipse(-8, 8, 4, 6, 0.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.velocity = { x: 0, y: 0 };
                this.angle = -Math.PI / 2;
                this.invulnerable = 120; // 2 seconds of invulnerability
            }
        }

        // Frog head missile
        class Missile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.velocity = {
                    x: Math.cos(angle) * 5,
                    y: Math.sin(angle) * 5
                };
                this.radius = 4;
                this.life = 60; // Frames until removal
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.life--;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Frog head
                ctx.fillStyle = '#90EE90';
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(-1, -2, 1.5, 0, Math.PI * 2);
                ctx.arc(-1, 2, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Pupils
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-1, -2, 0.7, 0, Math.PI * 2);
                ctx.arc(-1, 2, 0.7, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // Orange face asteroid
        class Asteroid {
            constructor(x, y, size = 3) {
                this.x = x;
                this.y = y;
                this.size = size; // 3=large, 2=medium, 1=small
                this.radius = size * 15;

                const angle = Math.random() * Math.PI * 2;
                const speed = (4 - size) * 0.5 + Math.random();
                this.velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.rotation += this.rotationSpeed;

                // Wrap around screen
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const r = this.radius;

                // Orange face
                ctx.fillStyle = '#FF8C00';
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();

                // Blonde wavy hair
                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#FFD700';
                ctx.lineWidth = 2;

                // Hair strands
                for (let i = 0; i < 8; i++) {
                    const hairAngle = (Math.PI * 2 * i) / 8 - Math.PI / 2;
                    const hairX = Math.cos(hairAngle) * r;
                    const hairY = Math.sin(hairAngle) * r;

                    ctx.beginPath();
                    ctx.arc(hairX * 0.7, hairY * 0.7 - r * 0.3, r * 0.2, 0, Math.PI * 2);
                    ctx.fill();

                    // Wavy strands
                    ctx.beginPath();
                    ctx.moveTo(hairX * 0.8, hairY * 0.8 - r * 0.2);
                    ctx.quadraticCurveTo(
                        hairX * 1.2, hairY * 1.2 - r * 0.3,
                        hairX * 1.1, hairY * 1.1 - r * 0.5
                    );
                    ctx.stroke();
                }

                // Eyes
                const eyeSize = r * 0.15;
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-r * 0.25, -r * 0.2, eyeSize, 0, Math.PI * 2);
                ctx.arc(r * 0.25, -r * 0.2, eyeSize, 0, Math.PI * 2);
                ctx.fill();

                // Angry eyebrows
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = r * 0.08;
                ctx.beginPath();
                ctx.moveTo(-r * 0.4, -r * 0.35);
                ctx.lineTo(-r * 0.1, -r * 0.3);
                ctx.moveTo(r * 0.4, -r * 0.35);
                ctx.lineTo(r * 0.1, -r * 0.3);
                ctx.stroke();

                // Mouth (angry)
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = r * 0.08;
                ctx.beginPath();
                ctx.arc(0, r * 0.2, r * 0.3, 0.2, Math.PI - 0.2);
                ctx.stroke();

                ctx.restore();
            }

            split() {
                if (this.size > 1) {
                    return [
                        new Asteroid(this.x, this.y, this.size - 1),
                        new Asteroid(this.x, this.y, this.size - 1)
                    ];
                }
                return [];
            }
        }

        // Game objects
        let ship = new Ship();
        let missiles = [];
        let asteroids = [];
        let lastShot = 0;

        // Initialize asteroids
        function createAsteroids(count) {
            for (let i = 0; i < count; i++) {
                let x, y;
                // Spawn away from ship
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 150);

                asteroids.push(new Asteroid(x, y, 3));
            }
        }

        // Collision detection
        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < obj1.radius + obj2.radius;
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' ||
                e.code === 'ArrowUp' || e.code === 'Space') {
                e.preventDefault();
            }

            if (e.code in keys) {
                keys[e.code] = true;
            }

            // Fire missile
            if (e.code === 'Space' && gameState.playing) {
                const now = Date.now();
                if (now - lastShot > 250) { // Rate limit
                    missiles.push(new Missile(ship.x, ship.y, ship.angle));
                    lastShot = now;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                keys[e.code] = false;
            }
        });

        // Update game
        function update() {
            if (!gameState.playing) return;

            ship.update();

            // Update missiles
            missiles = missiles.filter(m => !m.isDead());
            missiles.forEach(m => m.update());

            // Update asteroids
            asteroids.forEach(a => a.update());

            // Check missile-asteroid collisions
            for (let i = missiles.length - 1; i >= 0; i--) {
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    if (checkCollision(missiles[i], asteroids[j])) {
                        // Split asteroid
                        const newAsteroids = asteroids[j].split();
                        asteroids.splice(j, 1);
                        asteroids.push(...newAsteroids);

                        // Remove missile
                        missiles.splice(i, 1);

                        // Update score
                        gameState.score += 10;
                        document.getElementById('score').textContent = gameState.score;
                        break;
                    }
                }
            }

            // Check ship-asteroid collisions
            if (ship.invulnerable === 0) {
                for (let asteroid of asteroids) {
                    if (checkCollision(ship, asteroid)) {
                        gameState.lives--;
                        document.getElementById('lives').textContent = gameState.lives;

                        if (gameState.lives <= 0) {
                            gameOver();
                        } else {
                            ship.reset();
                        }
                        break;
                    }
                }
            }

            // Check if all asteroids destroyed
            if (asteroids.length === 0) {
                gameState.level++;
                createAsteroids(3 + gameState.level);
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            ctx.fillStyle = 'white';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137.5) % canvas.width;
                const y = (i * 234.7) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }

            ship.draw();
            missiles.forEach(m => m.draw());
            asteroids.forEach(a => a.draw());
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Game over
        function gameOver() {
            gameState.playing = false;
            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('gameOver').style.display = 'block';
        }

        // Restart game
        function restartGame() {
            gameState = {
                playing: true,
                score: 0,
                lives: 3,
                level: 1
            };

            document.getElementById('score').textContent = 0;
            document.getElementById('lives').textContent = 3;
            document.getElementById('gameOver').style.display = 'none';

            ship = new Ship();
            missiles = [];
            asteroids = [];

            createAsteroids(3);
        }

        // Start game
        createAsteroids(3);
        gameLoop();
    </script>
</body>
</html>
